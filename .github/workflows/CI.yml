name: CI

# Single-file CI for Ryty: builds the CLI + Qt6 GUI on Linux and Windows,
# bundles the Qt6 runtime with the GUI so it runs standalone, runs the test
# suite, and publishes artifacts (and GitHub releases for v* tags).
#
# Outputs per platform:
#   Linux   : Ryty-<ver>-linux-x86_64.zip  (CLI binary + Ryty-GUI AppImage with
#                                             Qt6 libs/plugins embedded)
#   Windows : Ryty-<ver>-windows-x86_64.zip (ryty.exe, ryty-gui.exe + windeployqt
#                                             deployed Qt6 DLLs/plugins)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.2'

jobs:
  # ---------------------------------------------------------------- Linux ---
  linux:
    name: Linux x86_64 (CLI + Qt6 GUI AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build zip libgl1-mesa-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-randr0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt ${{ env.QT_VERSION }} (linux_gcc_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Determine version string
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${GITHUB_SHA:0:7}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Configure (linux-release preset)
        run: |
          cmake --preset linux-release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake"

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Locate build directory and binaries
        id: locate
        run: |
          BUILD_DIR="build/linux-release"
          CLI_EXE="$(find "$BUILD_DIR" -type f -name ryty | head -n1)"
          GUI_EXE="$(find "$BUILD_DIR" -type f -name ryty-gui | head -n1)"
          echo "build_dir=$BUILD_DIR"        >> "$GITHUB_OUTPUT"
          echo "cli_exe=$CLI_EXE"            >> "$GITHUB_OUTPUT"
          echo "gui_exe=$GUI_EXE"            >> "$GITHUB_OUTPUT"
          test -n "$CLI_EXE" && test -n "$GUI_EXE"

      - name: Run tests
        run: ctest --test-dir build/linux-release --output-on-failure --parallel 2

      - name: Bundle GUI into AppImage (Qt6 runtime embedded)
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          CLI_EXE="${{ steps.locate.outputs.cli_exe }}"
          GUI_EXE="${{ steps.locate.outputs.gui_exe }}"

          mkdir -p ci-tools AppDir
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
               -O ci-tools/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
               -O ci-tools/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x ci-tools/*.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          export VERSION="$VER"
          export PATH="$QT_ROOT_DIR/bin:$PATH"

          # Phase 1: deploy binaries, Qt6 libs + plugins, desktop file, icon.
          ./ci-tools/linuxdeploy-x86_64.AppImage \
            --appimage-extract-and-run \
            --appdir "$PWD/AppDir" \
            -e "$CLI_EXE" \
            -e "$GUI_EXE" \
            -i ci/ryty.png \
            -d ci/ryty-gui.desktop \
            --plugin qt

          # Phase 2: ship the offscreen platform plugin too so the AppImage
          # can be smoke-tested (and used) on headless machines.
          cp "$QT_ROOT_DIR/plugins/platforms/libqoffscreen.so" \
             AppDir/usr/plugins/platforms/

          # Phase 3: produce the AppImage (AppRun -> GUI via desktop Exec).
          ./ci-tools/linuxdeploy-x86_64.AppImage \
            --appimage-extract-and-run \
            --appdir "$PWD/AppDir" \
            -e "$GUI_EXE" \
            --output appimage

          mv Ryty_GUI-*.AppImage "Ryty-GUI-$VER-linux-x86_64.AppImage"

      - name: Smoke test bundled GUI (headless, non-fatal)
        run: |
          VER="${{ steps.ver.outputs.version }}"
          QT_QPA_PLATFORM=offscreen \
            "./Ryty-GUI-$VER-linux-x86_64.AppImage" --appimage-extract-and-run \
            > /tmp/gui-smoke.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then
            echo "GUI launched and stayed alive: OK"
            kill "$PID" 2>/dev/null || true
          else
            echo "::warning::GUI exited early — inspect /tmp/gui-smoke.log"
            cat /tmp/gui-smoke.log || true
          fi

      - name: Assemble Linux zip (CLI + GUI AppImage)
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          STAGE="Ryty-$VER-linux-x86_64"
          mkdir -p "$STAGE"
          cp "${{ steps.locate.outputs.cli_exe }}" "$STAGE/ryty"
          cp "Ryty-GUI-$VER-linux-x86_64.AppImage" "$STAGE/"
          cp ci/README.txt "$STAGE/README.txt"
          zip -r "Ryty-$VER-linux-x86_64.zip" "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryty-linux-x86_64
          path: Ryty-*-linux-x86_64.zip
          if-no-files-found: error

      - name: Publish release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ryty-*-linux-x86_64.zip
          generate_release_notes: true

  # -------------------------------------------------------------- Windows ---
  windows:
    name: Windows x86_64 (CLI + Qt6 GUI)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 UCRT64 (toolchain + Qt6)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Determine version string
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${GITHUB_SHA:0:7}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Configure (windows-release preset)
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build build/windows-release --parallel

      - name: Locate build directory and binaries
        id: locate
        run: |
          BUILD_DIR="build/windows-release"
          CLI_EXE="$(find "$BUILD_DIR" -type f -name ryty.exe | head -n1)"
          GUI_EXE="$(find "$BUILD_DIR" -type f -name ryty-gui.exe | head -n1)"
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "cli_exe=$CLI_EXE"     >> "$GITHUB_OUTPUT"
          echo "gui_exe=$GUI_EXE"     >> "$GITHUB_OUTPUT"
          test -n "$CLI_EXE" && test -n "$GUI_EXE"

      - name: Run tests
        run: ctest --test-dir build/windows-release --output-on-failure --parallel 2

      - name: Deploy Qt6 runtime next to the GUI (windeployqt)
        run: |
          set -euo pipefail
          CLI_EXE="${{ steps.locate.outputs.cli_exe }}"
          GUI_EXE="${{ steps.locate.outputs.gui_exe }}"
          STAGE="Ryty-windows-x86_64"
          mkdir -p "$STAGE"
          cp "$CLI_EXE" "$STAGE/ryty.exe"
          cp "$GUI_EXE" "$STAGE/ryty-gui.exe"

          WINDEPLOY="$(command -v windeployqt6 || command -v windeployqt)"
          echo "Using $WINDEPLOY"
          "$WINDEPLOY" --release --no-translations --dir "$STAGE" --compiler-runtime "$STAGE/ryty-gui.exe"

          # Defensive: make sure all dependent MinGW and UCRT64 runtime DLLs are present
          # even if windeployqt skipped them.
          for iter in 1 2 3; do
            for file in "$STAGE"/*.exe "$STAGE"/*.dll "$STAGE"/platforms/*.dll "$STAGE"/styles/*.dll "$STAGE"/imageformats/*.dll; do
              if [ -f "$file" ]; then
                (ldd "$file" 2>/dev/null | grep -i "/ucrt64/bin/" || true) | awk '{print $3}' | while read -r dllpath; do
                  if [ -n "$dllpath" ] && [ -f "$dllpath" ] && [ ! -f "$STAGE/$(basename "$dllpath")" ]; then
                    cp "$dllpath" "$STAGE/"
                  fi
                done
              fi
            done
          done
          ls -la "$STAGE"

      - name: Zip package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path 'Ryty-windows-x86_64' `
            -DestinationPath "Ryty-$ver-windows-x86_64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryty-windows-x86_64
          path: Ryty-*-windows-x86_64.zip
          if-no-files-found: error

      - name: Publish release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ryty-*-windows-x86_64.zip
          generate_release_notes: true

  # ---------------------------------------------------------------- macOS ---
  macos:
    name: macOS (CLI + Metal)
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install ninja

      - name: Determine version string
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${GITHUB_SHA:0:7}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -B build/macos -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/macos --parallel

      - name: Run tests
        run: ctest --test-dir build/macos --output-on-failure --parallel 2

      - name: Assemble macOS package
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          STAGE="Ryty-$VER-macos"
          mkdir -p "$STAGE"
          CLI_EXE="$(find build/macos -type f -name ryty | head -n1)"
          cp "$CLI_EXE" "$STAGE/ryty"
          cp ci/README.txt "$STAGE/README.txt"
          zip -r "Ryty-$VER-macos.zip" "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ryty-macos
          path: Ryty-*-macos.zip
          if-no-files-found: error

      - name: Publish release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ryty-*-macos.zip
          generate_release_notes: true

  # ------------------------------------------------- Linux CLI-only check ---
  linux-cli:
    name: Linux CLI-only (no Qt, graceful GUI skip)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure (linux-release-cli preset, no Qt installed)
        run: cmake --preset linux-release-cli

      - name: Build
        run: cmake --build build/linux-release-cli --parallel

      - name: Run tests
        run: ctest --test-dir build/linux-release-cli --output-on-failure --parallel 2
