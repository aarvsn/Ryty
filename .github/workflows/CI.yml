name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  linux:
    name: Linux (GUI + tests, AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.8.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          host: linux
          target: desktop
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build build/linux-release --parallel
      - name: Test
        run: ctest --test-dir build/linux-release --output-on-failure
      - name: Headless GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/linux-release/app/gui/ryty-gui --version
      - name: Package (zip with CLI + AppImage)
        if: always()
        run: |
          mkdir -p dist
          cp build/linux-release/core/relinker/ryty dist/
          zip -r ryty-linux.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: ryty-linux
          path: ryty-linux.zip

  windows:
    name: Windows (GUI + tests, MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            python
            zip
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build build/windows-release --parallel
      - name: Test
        run: ctest --test-dir build/windows-release --output-on-failure
      - name: Package (zip with CLI + GUI bundle)
        if: always()
        run: |
          mkdir -p dist
          cp build/windows-release/core/relinker/ryty.exe dist/
          cp build/windows-release/app/gui/ryty-gui.exe dist/
          zip -r ryty-windows.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: ryty-windows
          path: ryty-windows.zip

  linux-cli:
    name: Linux CLI (no Qt, graceful GUI skip)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset linux-release-cli
      - name: Build
        run: cmake --build build/linux-release-cli --parallel
      - name: Test
        run: ctest --test-dir build/linux-release-cli --output-on-failure

  macos:
    name: macOS (CLI + tests, Metal bridge, codesign check)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: mac
          target: desktop
      - name: Configure
        run: cmake --preset macos-release
      - name: Build
        run: cmake --build build/macos-release --parallel
      - name: Test
        run: ctest --test-dir build/macos-release --output-on-failure
      - name: macOS toolchain smoke test
        run: |
          # The Metal bridge must be present and the CLI must accept --macos.
          ./build/macos-release/core/relinker/ryty --help || true
          python3 core/relinker/tests/MacOsSignatureTests.py build/macos-release/core/relinker/ryty
      - name: Package
        if: always()
        run: |
          mkdir -p dist
          cp build/macos-release/core/relinker/ryty dist/
          zip -r ryty-macos.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: ryty-macos
          path: ryty-macos.zip

  release:
    name: Publish release zips
    needs: [linux, windows, macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ryty-linux/ryty-linux.zip
            artifacts/ryty-windows/ryty-windows.zip
            artifacts/ryty-macos/ryty-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
